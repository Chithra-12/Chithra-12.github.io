<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday ❤️</title>

  <!-- Clean, reader-friendly font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fdfaf6;
      font-family: 'Merriweather', serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Wrapper (keeps content centered above effects) */
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    /* TOP */
    .top {
      font-size: 18px;
    }

    .heart {
      display: inline-block;
      color: #e63946;
      animation: heartbeat 1.2s infinite;
      margin: 0 6px;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      25%,75% { transform: scale(1.2); }
    }

    /* 🎉 Celebration animation */
    .celebrate {
      font-size: 32px;
      animation: popIn 1.2s ease-out forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* 💋 Kiss animation */
    .kiss {
      display: inline-block;
      margin-left: 6px;
      animation: kissFloat 2s ease-in-out infinite;
    }

    @keyframes kissFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* BUTTON */
    .btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    /* ❤️ HEART RAIN */
    .heart-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .rain-heart {
      position: absolute;
      top: -20px;
      color: #e63946;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    /* 🎉 CONFETTI */
    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>

<body>

  <!-- Effects -->
  <canvas id="confetti"></canvas>
  <div class="heart-rain"></div>

  <!-- Centered Content -->
  <div class="wrapper">

    <div class="top">
      Karthick <span class="heart">❤️</span> Kanmani
    </div>

    <div class="celebrate">🎉 Happiest Birthday Wishes Pattu 🎉</div>

    <div class="love-line">
      Kanmani loves you more <span class="kiss">💋</span>
    </div>

    <button class="btn" onclick="goToLetter()">Read the Letter 💌</button>

  </div>

  <script>
    function goToLetter() {
      window.location.href = "Letter.html";
    }

    /* 🎉 Confetti burst */
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let pieces = [];
    for (let i = 0; i < 120; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 6 + 4,
        color: `hsl(${Math.random() * 360}, 70%, 60%)`
      });
    }

    let confettiFrames = 120;

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.y += 3;
      });
    }

    function animateConfetti() {
      if (confettiFrames-- > 0) {
        drawConfetti();
        requestAnimationFrame(animateConfetti);
      } else {
        canvas.style.display = "none";
      }
    }

    animateConfetti();

    /* ❤️ Heart rain */
    const heartContainer = document.querySelector(".heart-rain");

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("rain-heart");
      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 10) + "px";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";

      heartContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>

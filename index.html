<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday ❤️</title>

  <!-- Clean, reader-friendly font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #fdfaf6;
      font-family: 'Merriweather', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
  }


    /* TOP */
    .top {
      font-size: 18px;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .heart {
      display: inline-block;
      color: #e63946;
      animation: heartbeat 1.2s infinite;
      margin: 0 6px;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* CENTER */
    .center {
      margin-bottom: 40px;  
      }

    .bottom {
      margin-bottom: 20px;  
    }

    /* 🎉 Celebration animation */
    .celebrate {
      font-size: 32px;
      margin-bottom: 12px;
      animation: popIn 1.2s ease-out forwards;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }
      60% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    /* 💋 Kiss animation */
    .kiss {
      font-size: 18px;
      font-weight: 400;
      color: #555;
      position: relative;
      animation: kissFloat 2s ease-in-out infinite;
    }

    .kiss::after {
      content: "💋";
      position: absolute;
      right: -28px;
      top: 0;
      animation: kissPop 2s ease-in-out infinite;
    }

    @keyframes kissFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }

    @keyframes kissPop {
      0% {
        transform: scale(0.8);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(0.8);
        opacity: 0.6;
      }
    }

    /* BUTTON */
    .bottom {
      margin-bottom: 30px;
    }

    .btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>

  <!-- TOP -->
  <div class="top">
    Karthick <span class="heart">❤️</span> Kanmani
  </div>

  <!-- CENTER -->
  <div class="center">
    <div class="celebrate">🎉 Happiest Birthday Wishes Pattu 🎉</div>
    <p><div class="kiss">Kanmani loves you more</div></p>
  </div>

  <!-- BOTTOM -->
  <div class="bottom">
    <button class="btn" onclick="goToLetter()">Read the Letter 💌</button>
  </div>

  <script>
    function goToLetter() {
      window.location.href = "Letter.html";
    }
  </script>

</body>
</html>
